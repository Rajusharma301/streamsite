<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch &mdash; StreamVibe</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="logo">
    <span class="logo-mark">S</span>
    <span class="logo-text">tream<b>Vibe</b></span>
  </div>
  <nav class="main-nav">
    <a href="/?p=home">Home</a>
    <a href="/?p=videos">Videos</a>
    <a href="/?p=categories">Categories</a>
    <a href="/admin">Admin</a>
  </nav>
  <div class="search">
    <input id="search-input" type="text" placeholder="Search videos...">
    <button id="search-btn">Search</button>
  </div>
  <div class="user-actions" id="user-actions">
    <button id="theme-toggle" class="icon-btn" title="Toggle theme">&#9790;</button>
  </div>
</header>

<div class="layout watch-layout">
  <main class="content">
    <div class="player-wrap">
      <video id="player" controls preload="metadata"></video>
    </div>
    <div class="video-meta">
      <h1 id="video-title" class="video-title">Loading...</h1>
      <div class="meta-row">
        <span class="views" id="video-size">0 MB</span>
        <span class="ext-badge" id="video-ext">mp4</span>
      </div>
    </div>
  </main>
  <aside class="sidebar">
    <h3>Related Videos</h3>
    <ul class="related-list" id="related-list"></ul>
  </aside>
</div>

<div class="modal-backdrop" id="auth-modal" style="display:none">
  <div class="modal">
    <div class="modal-tabs">
      <button class="tab active" id="tab-login">Log in</button>
      <button class="tab" id="tab-signup">Sign up</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label>Username</label>
      <input type="text" id="auth-username" required minlength="3" maxlength="24" autocomplete="username">
      <label>Password</label>
      <input type="password" id="auth-password" required minlength="4" autocomplete="current-password">
      <p class="form-error" id="auth-error"></p>
      <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
    </form>
    <button class="modal-close" id="auth-close">&times;</button>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/app.js"></script>
</body>
</html>
