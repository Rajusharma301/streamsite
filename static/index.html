<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVibe</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="logo">
    <span class="logo-mark">S</span>
    <span class="logo-text">tream<b>Vibe</b></span>
  </div>
  <nav class="main-nav">
    <a href="/?p=home" class="active">Home</a>
    <a href="/?p=videos">Videos</a>
    <a href="/?p=categories">Categories</a>
    <a href="/?p=upload">Admin</a>
  </nav>
  <div class="search">
    <input id="search-input" type="text" placeholder="Search videos...">
    <button id="search-btn">Search</button>
  </div>
  <div class="user-actions" id="user-actions">
    <button id="layout-toggle" class="icon-btn" title="Toggle layout">&#9776;</button>
    <button id="theme-toggle" class="icon-btn" title="Toggle theme">&#9790;</button>
  </div>
</header>

<div class="category-bar" id="category-bar"></div>

<div class="toolbar">
  <select id="sort-select">
    <option value="newest">Sort: Newest</option>
    <option value="name">Sort: Name (A-Z)</option>
    <option value="size-desc">Sort: Size (Large)</option>
    <option value="size-asc">Sort: Size (Small)</option>
  </select>
  <span class="result-count" id="result-count"></span>
</div>

<div class="layout">
  <main class="content">
    <h2 class="section-title" id="section-title">Trending</h2>
    <div class="video-grid" id="video-grid"></div>
    <div class="empty" id="empty" style="display:none">
      <p>No videos yet.</p>
      <p>Upload one via the Upload page (admin) or put files into the <code>videos/</code> folder.</p>
    </div>
  </main>
  <aside class="sidebar">
    <h3>Categories</h3>
    <ul id="sidebar-cats"></ul>
  </aside>
</div>

<footer class="footer">
  <p>StreamVibe &copy; 2026 &mdash; Personal streaming site</p>
</footer>

<div class="modal-backdrop" id="auth-modal" style="display:none">
  <div class="modal">
    <div class="modal-tabs">
      <button class="tab active" id="tab-login">Log in</button>
      <button class="tab" id="tab-signup">Sign up</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label>Username</label>
      <input type="text" id="auth-username" required minlength="3" maxlength="24" autocomplete="username">
      <label>Password</label>
      <input type="password" id="auth-password" required minlength="4" autocomplete="current-password">
      <p class="form-error" id="auth-error"></p>
      <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
    </form>
    <button class="modal-close" id="auth-close">&times;</button>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/app.js"></script>
</body>
</html>
