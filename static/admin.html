<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Console &mdash; StreamVibe</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="ac-wrap">
  <aside class="ac-sidebar">
    <div class="ac-brand">StreamVibe <span>Admin</span></div>
    <nav class="ac-nav">
      <button class="ac-link active" data-tab="upload">Upload file</button>
      <button class="ac-link" data-tab="embed">Add embed</button>
      <button class="ac-link" data-tab="manage">Manage videos</button>
    </nav>
    <div class="ac-side-footer">
      <a class="ac-site-link" href="/">Go to site</a>
      <div id="ac-user"></div>
    </div>
  </aside>

  <main class="ac-main">
    <div class="ac-head">
      <h1 id="ac-title">Admin Console</h1>
      <div class="user-actions" id="user-actions">
        <button id="theme-toggle" class="icon-btn" title="Toggle theme">&#9790;</button>
      </div>
    </div>
    <div id="admin-content" class="ac-content"></div>
  </main>
</div>

<div class="modal-backdrop" id="auth-modal" style="display:none">
  <div class="modal">
    <div class="modal-tabs">
      <button class="tab active" id="tab-login">Log in</button>
      <button class="tab" id="tab-signup">Sign up</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label>Username</label>
      <input type="text" id="auth-username" required minlength="3" maxlength="24" autocomplete="username">
      <label>Password</label>
      <input type="password" id="auth-password" required minlength="4" autocomplete="current-password">
      <p class="form-error" id="auth-error"></p>
      <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
    </form>
    <button class="modal-close" id="auth-close">&times;</button>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/admin.js"></script>
</body>
</html>
