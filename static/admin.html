<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel &mdash; StreamVibe</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="logo">
    <span class="logo-mark">S</span>
    <span class="logo-text">tream<b>Vibe</b></span>
  </div>
  <nav class="main-nav">
    <a href="/">Home</a>
    <span class="nav-sep">/</span>
    <a href="/admin.html" class="active">Admin Panel</a>
  </nav>
  <div class="user-actions" id="user-actions">
    <button id="theme-toggle" class="icon-btn" title="Toggle theme">&#9790;</button>
  </div>
</header>

<div class="admin-wrap">
  <h1 class="admin-heading">Admin Panel</h1>
  <div class="admin-panel">
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="upload">Upload file</button>
      <button class="admin-tab" data-tab="embed">Add embed</button>
      <button class="admin-tab" data-tab="manage">Manage videos</button>
    </div>
    <div class="admin-body">
      <div id="admin-content"></div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="auth-modal" style="display:none">
  <div class="modal">
    <div class="modal-tabs">
      <button class="tab active" id="tab-login">Log in</button>
      <button class="tab" id="tab-signup">Sign up</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <label>Username</label>
      <input type="text" id="auth-username" required minlength="3" maxlength="24" autocomplete="username">
      <label>Password</label>
      <input type="password" id="auth-password" required minlength="4" autocomplete="current-password">
      <p class="form-error" id="auth-error"></p>
      <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
    </form>
    <button class="modal-close" id="auth-close">&times;</button>
  </div>
</div>

<script src="/auth.js"></script>
<script src="/admin.js"></script>
</body>
</html>
